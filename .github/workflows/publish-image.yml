name: Docker Publish GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build, Scan and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Test container health
        run: |
          docker run -d --name devsecops-health-test -p 8081:80 \
            "${{ steps.image.outputs.name }}:${{ github.sha }}"

          for i in $(seq 1 15); do
            if curl --fail --silent http://localhost:8081 > /dev/null; then
              echo "Health check OK: HTTP 200"
              docker rm -f devsecops-health-test
              exit 0
            fi
            sleep 2
          done

          echo "ERROR: Application did not respond"
          docker logs devsecops-health-test || true
          docker rm -f devsecops-health-test || true
          exit 1

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
